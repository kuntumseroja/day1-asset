# D-ETP portal + API reverse proxy (nginx on EC2 host)
# Copy to /etc/nginx/sites-available/detp on the instance.

upstream portal_bff {
    server 127.0.0.1:8093;
}

upstream recon_api {
    server 127.0.0.1:8085;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /var/www/detp-portal;
    index index.html;

    # Portal static (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Portal BFF (portal-sim) — same origin, no CORS issues
    location /api/v1/ {
        proxy_pass http://portal_bff/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket settlement events
    location /ws {
        proxy_pass http://portal_bff/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Recon service (optional dashboard tile)
    location /recon/api/v1/ {
        proxy_pass http://recon_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
