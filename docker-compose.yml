services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: detp
      POSTGRES_PASSWORD: detp
      POSTGRES_DB: detp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/V1__core_tables.sql:/docker-entrypoint-initdb.d/V1__core_tables.sql
      - ./db/init-pact-db.sh:/docker-entrypoint-initdb.d/00-init-pact-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:28082
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:28082
      - --schema-registry-addr=0.0.0.0:28081
    ports:
      - "9092:9092"
      - "28081:28081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  debezium:
    image: debezium/connect:2.7.3.Final
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: detp-debezium
      CONFIG_STORAGE_TOPIC: detp_connect_configs
      OFFSET_STORAGE_TOPIC: detp_connect_offsets
      STATUS_STORAGE_TOPIC: detp_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15

  debezium-init:
    build: ./db/debezium
    environment:
      CONNECT_URL: http://debezium:8083
    depends_on:
      debezium:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/detp-realm.json:/opt/keycloak/data/import/detp-realm.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8180/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15

  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=detp
      - POSTGRES_PWD=detp
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  pact-broker:
    image: pactfoundation/pact-broker:latest
    environment:
      PACT_BROKER_DATABASE_URL: postgres://detp:detp@postgres:5432/pact
      PACT_BROKER_BASIC_AUTH_USERNAME: pact
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact
    ports:
      - "9292:9292"
    depends_on:
      postgres:
        condition: service_healthy

  rtgs-sim:
    build: ./sim/rtgs-sim
    ports:
      - "8091:8081"
    environment:
      PORT: 8081
      SAGA_WEBHOOK_URL: http://saga-lib:8086/api/v1/rtgs/debit-confirmed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  firefly-stub:
    build: ./sim/firefly-stub
    ports:
      - "8092:8082"
    environment:
      PORT: 8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  portal-sim:
    build:
      context: ./sim
      dockerfile: portal-sim/Dockerfile
    ports:
      - "8093:8083"
    environment:
      PORT: 8083
      POLICY_URL: http://policy:8084
      RTGS_SIM_URL: http://rtgs-sim:8081
    volumes:
      - ./sim/scripted-day.json:/app/scripted-day.json:ro
    depends_on:
      rtgs-sim:
        condition: service_healthy
      policy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  saga-lib:
    build: ./saga-lib
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/detp
      TEMPORAL_TARGET: temporal:7233
      FIREFLY_URL: http://firefly-stub:8082
      RTGS_URL: http://rtgs-sim:8081
      POLICY_URL: http://policy:8084
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      firefly-stub:
        condition: service_healthy
      policy:
        condition: service_healthy

  policy:
    build: ./policy
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/detp
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  recon:
    build: ./recon
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/detp
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RECON_RTGS_URL: http://rtgs-sim:8081
      RECON_FIREFLY_URL: http://firefly-stub:8082
    depends_on:
      postgres:
        condition: service_healthy
      rtgs-sim:
        condition: service_healthy
      firefly-stub:
        condition: service_healthy

  firefly-kit:
    build: ./firefly-kit
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/detp
      FIREFLY_URL: http://firefly-stub:8082
      FIREFLY_WS_URL: ws://firefly-stub:8082/ws
      SAGA_URL: http://saga-lib:8086
    depends_on:
      postgres:
        condition: service_healthy
      firefly-stub:
        condition: service_healthy
      saga-lib:
        condition: service_started

volumes:
  pgdata:
