server:
  port: 8084
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/detp}
    username: detp
    password: detp
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    admin:
      auto-create: true
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
    consumer:
      group-id: policy-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

policy:
  traffic-replay-path: ${TRAFFIC_REPLAY_PATH:../sim/yesterday-traffic.json}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
