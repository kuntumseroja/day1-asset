openapi: 3.0.3
info:
  title: Portal BFF API
  version: 0.1.0
  description: Participant portal backend-for-frontend (Node/Express prototype)
servers:
  - url: http://localhost:8083/api/v1
paths:
  /auth/me:
    get:
      summary: Current user profile from OIDC token
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /issuance:
    post:
      summary: Submit issuance request
      operationId: submitIssuance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuanceRequest'
      responses:
        '201':
          description: Issuance queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Validation error
        '403':
          description: Policy denied
  /queue:
    get:
      summary: FAFO settlement queue (FIFO)
      operationId: getQueue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue items ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
  /limits:
    get:
      summary: Participant limit consumption
      operationId: getLimits
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Limit gauges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsDashboard'
  /transactions/{uetr}:
    get:
      summary: Transaction detail with ISO 20022
      operationId: getTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: uetr
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '404':
          description: Not found
  /ws:
    get:
      summary: WebSocket upgrade for settlement events
      operationId: subscribeEvents
      description: Payload follows contracts/avro/settlement-events.avsc as JSON
      responses:
        '101':
          description: Switching Protocols
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfile:
      type: object
      required: [participantId, role, tier, displayName]
      properties:
        participantId:
          type: string
          example: BANK-A
        role:
          type: string
          enum: [MAKER, CHECKER, OPERATOR]
        tier:
          type: string
          enum: [TIER_1, TIER_2, TIER_3]
        displayName:
          type: string
    IssuanceRequest:
      type: object
      required: [amount, valueDate, fundingReference]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in Rupiah (whole units)
          example: 500000000
        valueDate:
          type: string
          format: date
        fundingReference:
          type: string
          maxLength: 64
    Transaction:
      type: object
      required: [uetr, type, status, amount, queuePosition]
      properties:
        uetr:
          type: string
          format: uuid
        type:
          type: string
          enum: [ISSUANCE, REDEMPTION, TRANSFER]
        status:
          type: string
          enum: [QUEUED, FUNDING, MINTING, SETTLED, DENIED, DUPLICATE_SUPPRESSED, COMPENSATED]
        amount:
          type: integer
          format: int64
        queuePosition:
          type: integer
        duplicateSuppressed:
          type: boolean
          default: false
    QueueItem:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            participantId:
              type: string
            submittedAt:
              type: string
              format: date-time
    LimitsDashboard:
      type: object
      properties:
        perIssuanceCap:
          type: integer
          format: int64
          example: 500000000
        perIssuanceUsed:
          type: integer
          format: int64
        dailyCumulativeCap:
          type: integer
          format: int64
        dailyCumulativeUsed:
          type: integer
          format: int64
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            timeline:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                  at:
                    type: string
                    format: date-time
            iso20022:
              type: object
              properties:
                messageType:
                  type: string
                  example: pacs.009.001.08
                xml:
                  type: string
